# on the stock 99-char / google-import-order rules (945 errors on origin/main).
extend-ignore = B902,C816,D100,D101,D102,D103,D104,D105,D106,D107,D203,D205,D209,D212,D213,D301,D400,D401,D403,D404,D406,D407,D413,D415,I202,I100,I101,I201,E301,E302,E303,E305,E402,W191,W291,W292,W293,E101,E122,Q000,Q001,Q002,Q003
